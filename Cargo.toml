[package]
name = "justin-rpg"
version = "0.1.0"
edition = "2021"
description = "Isekai top-down multiplayer RPG with combat and farming (Rust + Bevy)"
default-run = "justin-rpg"

[dependencies]
bevy = "0.19"
bevy_renet = "5.0" # must match Bevy minor version: bevy 0.19 <-> bevy_renet 5.x
bincode = "1.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }

# Bevy is unusably slow at opt-level 0; standard Bevy dev-profile setup.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
